<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History — SoilSense</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/"><span class="logo">🌱</span><span class="brand-name">SoilSense</span></a>
        </div>
        <div class="nav-links">
            <a href="/pages/dashboard.html">Dashboard</a>
            <a href="/pages/capture.html">New Analysis</a>
            <a href="/pages/history.html" class="active">History</a>
            <a href="/pages/education.html">Learn</a>
            <a href="#" onclick="logout()" class="btn btn-outline">Logout</a>
        </div>
    </nav>

    <main class="history-page">
        <div class="page-header">
            <h1>Analysis History</h1>
            <div class="filter-bar">
                <select id="filterSoilType" onchange="filterHistory()">
                    <option value="all">All Soil Types</option>
                    <option value="loamy">Loamy</option>
                    <option value="sandy">Sandy</option>
                    <option value="clay">Clay</option>
                    <option value="silty">Silty</option>
                    <option value="peaty">Peaty</option>
                    <option value="chalky">Chalky</option>
                </select>
            </div>
        </div>

        <div id="historyList" class="history-grid">
            <p class="empty-state">Loading...</p>
        </div>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/history.js"></script>
</body>
</html>
